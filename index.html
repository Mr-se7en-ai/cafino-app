<title>کافینو | CAFINO — سامانه مدیریت هوشمند کافی‌نت</title>
<style>
  @font-face{
    font-family:'Vazirmatn';
    src: url('./fonts/Vazirmatn-Regular.woff2') format('woff2');
    font-weight: 400;
    font-style: normal;
    font-display: swap;
  }
  @font-face{
    font-family:'Vazirmatn';
    src: url('./fonts/Vazirmatn-Bold.woff2') format('woff2');
    font-weight: 700;
    font-style: normal;
    font-display: swap;
  }
  @font-face{
    font-family:'Vazirmatn';
    src: url('./fonts/Vazirmatn-ExtraBold.woff2') format('woff2');
    font-weight: 800;
    font-style: normal;
    font-display: swap;
  }
  @font-face{
    font-family:'Vazirmatn';
    src: url('./fonts/Vazirmatn-Black.woff2') format('woff2');
    font-weight: 900;
    font-style: normal;
    font-display: swap;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:#0f172a;font-family:'Vazirmatn','Segoe UI',Tahoma,sans-serif;}
  #root{min-height:100vh;}
  #pwa-bar{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));z-index:99999;display:none;align-items:center;gap:10px;background:#1e293b;color:#e2e8f0;border:1px solid #334155;border-radius:14px;padding:10px 14px;font-family:'Vazirmatn',Tahoma,sans-serif;font-size:14px;box-shadow:0 10px 30px rgba(0,0,0,.45);max-width:520px;margin:0 auto}
  #pwa-bar span{flex:1;line-height:1.7}
  #pwa-bar button{font-family:inherit;font-size:13px;border:0;border-radius:10px;padding:8px 14px;cursor:pointer}
  #pwa-bar .p{background:#2563eb;color:#fff}
  #pwa-bar .s{background:transparent;color:#94a3b8}
  @media print{#pwa-bar{display:none!important}}
</style>
</head>
<body>
<div id="root"><div id="boot-splash" dir="rtl" style="display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;gap:14px;color:#94a3b8;font-family:'Vazirmatn',Tahoma,sans-serif;font-size:14px"><div style="width:34px;height:34px;border:3px solid #334155;border-top-color:#60a5fa;border-radius:50%;animation:cfspin .9s linear infinite"></div><div>در حال بارگذاری برنامه…</div></div></div><style>@keyframes cfspin{to{transform:rotate(360deg)}}</style>
<noscript><p style="color:#e2e8f0;padding:20px">برای اجرای برنامه، جاوااسکریپت باید فعال باشد.</p></noscript>
<script id="cafenet-fallback">
(function(){
  var errs=[],t0=Date.now(),done=false;
  window.__cfErrs=errs;
  window.addEventListener("error",function(e){errs.push((e.message||"")+(e.filename?" @ "+String(e.filename).split("/").pop()+":"+e.lineno:""));},true);
  window.addEventListener("unhandledrejection",function(e){errs.push("Promise: "+(e.reason&&e.reason.message||e.reason));});
  function mounted(){var r=document.getElementById("root");if(!r)return true;for(var i=0;i<r.childNodes.length;i++){if(r.childNodes[i].id!=="boot-splash")return true;}return false;}
  function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;");}
  function fnv(s){var h=0x811c9dc5;for(var i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,0x01000193)>>>0;}return h>>>0;}
  function errId(msg){var m=String(msg).replace(/\d+/g,"#").replace(/[a-f0-9]{16,}/gi,"?");return "CF-"+(fnv("boot|Error|"+m+"|")&0xffff).toString(16).toUpperCase().padStart(4,"0");}
  function logBoot(id,msg){try{var k="cafenet_error_log",rows=JSON.parse(localStorage.getItem(k)||"[]"),t=Date.now(),i;for(i=0;i<rows.length;i++)if(rows[i].id===id)break;
    if(i<rows.length){var r=rows.splice(i,1)[0];r.count=(r.count||1)+1;r.last=t;rows.unshift(r);}else rows.unshift({id:id,source:"boot",severity:"error",name:"Error",message:String(msg).slice(0,600),stack:"",count:1,first:t,last:t,context:{ua:navigator.userAgent.slice(0,120),protocol:location.protocol,online:navigator.onLine},occurrences:[{at:t}]});
    localStorage.setItem(k,JSON.stringify(rows.slice(0,100)));}catch(e){}}
  function fail(){
    var r=document.getElementById("root");if(!r||mounted())return;
    var why=window.__cfBundleErr?"فایل bundle.js پیدا یا دانلود نشد (آدرس/آپلود ناقص، یا باز کردن index.html از مدیر فایل گوشی که فایل‌های کناری را اجازه نمی‌دهد).":(window.__cafenetBundle?"فایل بارگذاری شد ولی برنامه نمایش داده نشد.":"فایل bundle.js اجرا نشد (بسیار کند یا ناقص).");
    var offline=navigator.onLine===false;if(offline)why+=" (اینترنت قطع است و نسخهٔ آفلاین این برنامه هنوز روی دستگاه ذخیره نشده؛ یک‌بار با اینترنت باز کنید.)";var id=errId(window.__cfBundleErr?"bundle-missing":(window.__cafenetBundle?"bundle-no-mount":"bundle-not-run"));logBoot(id,why);var info=["Error ID: "+id,why,"UA: "+navigator.userAgent,"protocol: "+location.protocol,"bundle: "+(window.__cafenetBundle||"not-run")].concat(errs).join("\n");
    r.innerHTML='<div dir="rtl" style="padding:24px;color:#e2e8f0;font-family:Tahoma,sans-serif;max-width:560px;margin:40px auto;line-height:2"><b>برنامه بارگذاری نشد</b> <span id="cf-err-id" dir="ltr" style="display:inline-block;background:#450a0a;color:#fca5a5;border-radius:6px;padding:1px 8px;font-weight:700">'+id+'</span><br>'+esc(why)+'<br>مطمئن شوید فایل <code>bundle.js</code> دقیقاً کنار <code>index.html</code> قرار دارد و هر دو از یک نسخه‌اند. روی گوشی بهتر است نسخه PWA را روی یک آدرس HTTPS باز کنید.<pre dir="ltr" style="background:#1e293b;padding:10px;border-radius:8px;white-space:pre-wrap;font-size:11px">'+esc(info)+'</pre><button onclick="location.reload()" style="padding:8px 16px;border-radius:8px;border:0;background:#2563eb;color:#fff;font-size:14px">تلاش دوباره</button></div>';
  }
  var iv=setInterval(function(){
    if(mounted()){clearInterval(iv);return;}
    if(window.__cfBundleErr||Date.now()-t0>45000){clearInterval(iv);fail();}
  },500);
})();
</script>
<div id="pwa-bar" dir="rtl" role="status"><span id="pwa-msg"></span><button class="p" id="pwa-ok"></button><button class="s" id="pwa-no">بعداً</button></div>
<script id="cafenet-pwa">
(function(){
  var bar=document.getElementById("pwa-bar"),msg=document.getElementById("pwa-msg"),ok=document.getElementById("pwa-ok"),no=document.getElementById("pwa-no");
  var standalone=(window.matchMedia&&matchMedia("(display-mode: standalone)").matches)||window.navigator.standalone===true;
  var action=null;
  function ls(k,v){try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v);}catch(e){return null;}}
  function show(text,btn,fn,dismissKey){msg.textContent=text;ok.textContent=btn;ok.style.display=btn?"":"none";action=fn;no.onclick=function(){bar.style.display="none";if(dismissKey)ls(dismissKey,String(Date.now()));};bar.style.display="flex";}
  ok.onclick=function(){bar.style.display="none";if(action)action();};
  var deferred=null;
  window.addEventListener("beforeinstallprompt",function(e){
    e.preventDefault();deferred=e;window.__cafenetInstall=function(){if(!deferred)return;deferred.prompt();deferred.userChoice.finally(function(){deferred=null;});};
    var t=+ls("cafenet_pwa_dismiss")||0;
    if(!standalone&&Date.now()-t>7*864e5)setTimeout(function(){if(deferred)show("برنامه را روی دستگاه نصب کنید تا مثل یک اپ و حتی بدون اینترنت اجرا شود.","نصب",window.__cafenetInstall,"cafenet_pwa_dismiss");},4000);
  });
  window.addEventListener("appinstalled",function(){bar.style.display="none";deferred=null;});
  var ios=/iphone|ipad|ipod/i.test(navigator.userAgent)&&!window.MSStream;
  if(ios&&!standalone){var t2=+ls("cafenet_pwa_ios_dismiss")||0;if(Date.now()-t2>14*864e5)setTimeout(function(){show("برای نصب: در Safari دکمه Share (اشتراک‌گذاری) را بزنید و «Add to Home Screen» را انتخاب کنید.","", null,"cafenet_pwa_ios_dismiss");no.textContent="متوجه شدم";},4000);}
  if("serviceWorker" in navigator&&(location.protocol==="https:"||location.hostname==="localhost"||location.hostname==="127.0.0.1")){
    window.addEventListener("load",function(){
      navigator.serviceWorker.register("sw.js").then(function(reg){
        function ready(w){show("نسخه جدید برنامه آماده است.","به‌روزرسانی",function(){w.postMessage("SKIP_WAITING");},null);no.textContent="بعداً";}
        if(reg.waiting&&navigator.serviceWorker.controller)ready(reg.waiting);
        reg.addEventListener("updatefound",function(){var w=reg.installing;if(!w)return;w.addEventListener("statechange",function(){if(w.state==="installed"&&navigator.serviceWorker.controller)ready(w);});});
        setInterval(function(){reg.update().catch(function(e){console.warn("[pwa] بررسی به‌روزرسانی ناموفق:",e&&e.message);});},60*60*1000);
      }).catch(function(e){console.warn("[pwa] ثبت Service Worker ناموفق؛ برنامه بدون حالت آفلاین ادامه می‌دهد:",e&&e.message);});
      var reloaded=false;navigator.serviceWorker.addEventListener("controllerchange",function(){if(reloaded||!window.__swHad)return;reloaded=true;location.reload();});
      window.__swHad=!!navigator.serviceWorker.controller;
    });
  }
})();
</script>
<script src="config.js"></script>
<script src="bundle.js" onerror="window.__cfBundleErr=1"></script>
</body>
